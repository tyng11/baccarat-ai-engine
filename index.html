<!-- Security & Application Logic Script -->
    <script>
        // Verified SHA-256 Hash for: "SecretKey#2026"
        const ADMIN_PASSWORD_HASH = "1254399dc0742d4a2cb5df2a160db1301c23f2603db0264052f3dc29f032252c";

        async function hashString(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function loginMember() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
        }

        function logout() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }

        function showAdminLogin() {
            document.getElementById('member-login-card').style.display = 'none';
            document.getElementById('admin-login-card').style.display = 'block';
        }

        function showMemberLogin() {
            document.getElementById('member-login-card').style.display = 'block';
            document.getElementById('admin-login-card').style.display = 'none';
            document.getElementById('admin-update-card').style.display = 'none';
            document.getElementById('admin-error').classList.add('hidden');
            document.getElementById('admin-key').value = '';
        }

        async function verifyAdmin() {
            const inputKey = document.getElementById('admin-key').value;
            const hashedInput = await hashString(inputKey);

            if (hashedInput === ADMIN_PASSWORD_HASH) {
                document.getElementById('admin-login-card').style.display = 'none';
                document.getElementById('admin-update-card').style.display = 'block';
                document.getElementById('admin-error').classList.add('hidden');
                document.getElementById('admin-key').value = '';
            } else {
                document.getElementById('admin-error').classList.remove('hidden');
            }
        }

        function saveNewPassword() {
            const newPass = document.getElementById('new-member-pass').value;
            if(!newPass) return;
            document.getElementById('success-msg').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('success-msg').classList.add('hidden');
                showMemberLogin();
            }, 1500);
        }
    </script>
