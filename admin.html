<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Manager - Baccarat AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-950 font-sans text-slate-100 p-4">

<!-- Admin Lock Screen -->
<div id="admin-lock-screen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
        <div class="w-12 h-12 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center mx-auto mb-3 text-lg">
            <i class="fa-solid fa-shield"></i>
        </div>
        <h2 class="text-base font-bold text-white font-mono tracking-wide uppercase mb-1">ADMIN LOGIN</h2>
        <p class="text-[11px] text-slate-400 font-mono mb-4">Enter admin master password to access password management.</p>
        
        <form id="admin-login-form" class="space-y-4">
            <input 
                type="password" 
                id="admin-password-input" 
                required 
                autocomplete="off"
                class="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 text-center font-mono text-lg tracking-wide text-amber-400 py-2 rounded-lg outline-none transition"
                placeholder="••••••••"
            >
            <div id="admin-error" class="text-red-400 text-[10px] font-mono hidden bg-red-500/10 border border-red-500/20 py-1 rounded">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Invalid admin password.
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-mono font-bold text-xs py-2.5 rounded-lg shadow-lg transition active:scale-95">
                <i class="fa-solid fa-lock-open mr-1"></i> UNLOCK ADMIN
            </button>
        </form>
    </div>
</div>

<!-- Main Admin Dashboard -->
<div id="admin-dashboard" class="hidden max-w-6xl mx-auto">
    <!-- Header -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-4 mb-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-amber-400 animate-pulse"></div>
            <h1 class="text-lg font-black tracking-widest text-white uppercase font-mono">ADMIN CONTROL PANEL</h1>
        </div>
        <button id="btn-logout" class="bg-slate-800 hover:bg-red-950/40 text-red-400 font-mono text-xs px-3 py-1.5 rounded border border-slate-700 hover:border-red-800/50 transition">
            <i class="fa-solid fa-sign-out-alt mr-1"></i> Logout
        </button>
    </div>

    <!-- Password Management Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <!-- Add New Password -->
        <div class="lg:col-span-1 bg-slate-900/80 border border-slate-800 rounded-lg p-4 shadow-md">
            <div class="text-sm font-mono font-bold text-slate-400 border-b border-slate-800 pb-2 mb-3 flex items-center gap-1">
                <i class="fa-solid fa-plus-circle text-cyan-400"></i> ADD NEW PASSWORD
            </div>
            
            <form id="add-password-form" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">5-Digit Password</label>
                    <input type="text" id="new-passcode" maxlength="5" pattern="[0-9]{5}" inputmode="numeric" required placeholder="e.g., 12345" class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 text-center font-mono text-lg tracking-widest py-2 rounded outline-none text-cyan-400">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">Rotation Schedule</label>
                    <select id="new-rotation" class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 text-xs py-2 rounded outline-none text-slate-200">
                        <option value="none">No Rotation</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="biweekly">Bi-Weekly</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">Description (Optional)</label>
                    <input type="text" id="new-description" placeholder="e.g., Member Tier 1" class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 text-xs py-2 rounded outline-none text-slate-200">
                </div>

                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-mono font-bold text-xs py-2 rounded transition active:scale-95">
                    <i class="fa-solid fa-plus mr-1"></i> Add Password
                </button>
            </form>
        </div>

        <!-- Current Active Passwords -->
        <div class="lg:col-span-2 bg-slate-900/80 border border-slate-800 rounded-lg p-4 shadow-md">
            <div class="text-sm font-mono font-bold text-slate-400 border-b border-slate-800 pb-2 mb-3 flex items-center gap-1">
                <i class="fa-solid fa-key text-amber-400"></i> ACTIVE PASSWORDS
            </div>
            
            <div id="passwords-list" class="space-y-2 max-h-96 overflow-y-auto">
                <p class="text-xs text-slate-500 italic">Loading passwords...</p>
            </div>
        </div>
    </div>

    <!-- Rotation Settings -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 shadow-md mb-6">
        <div class="text-sm font-mono font-bold text-slate-400 border-b border-slate-800 pb-2 mb-3 flex items-center gap-1">
            <i class="fa-solid fa-clock text-emerald-400"></i> ROTATION SCHEDULE
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-950 border border-slate-800 rounded p-3">
                <div class="text-xs text-slate-500 mb-2">Daily Rotation</div>
                <div class="text-2xl font-bold text-cyan-400 mb-2" id="daily-count">0</div>
                <button onclick="rotatePasswords('daily')" class="w-full bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-400 text-xs font-mono py-1.5 rounded border border-cyan-600/50 transition">
                    <i class="fa-solid fa-redo mr-1"></i> Rotate Now
                </button>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded p-3">
                <div class="text-xs text-slate-500 mb-2">Weekly Rotation</div>
                <div class="text-2xl font-bold text-emerald-400 mb-2" id="weekly-count">0</div>
                <button onclick="rotatePasswords('weekly')" class="w-full bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs font-mono py-1.5 rounded border border-emerald-600/50 transition">
                    <i class="fa-solid fa-redo mr-1"></i> Rotate Now
                </button>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded p-3">
                <div class="text-xs text-slate-500 mb-2">Bi-Weekly Rotation</div>
                <div class="text-2xl font-bold text-amber-400 mb-2" id="biweekly-count">0</div>
                <button onclick="rotatePasswords('biweekly')" class="w-full bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 text-xs font-mono py-1.5 rounded border border-amber-600/50 transition">
                    <i class="fa-solid fa-redo mr-1"></i> Rotate Now
                </button>
            </div>
        </div>
    </div>

    <!-- Password History & Logs -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4 shadow-md">
        <div class="text-sm font-mono font-bold text-slate-400 border-b border-slate-800 pb-2 mb-3 flex items-center gap-1">
            <i class="fa-solid fa-history text-slate-400"></i> ACTIVITY LOG
        </div>
        
        <div id="activity-log" class="space-y-2 max-h-64 overflow-y-auto font-mono text-xs">
            <p class="text-slate-500 italic">Loading activity log...</p>
        </div>
    </div>
</div>

<script>
    // Master admin password (CHANGE THIS to your own!)
    const MASTER_ADMIN_PASSWORD = "admin123";
    
    const elAdminLockScreen = document.getElementById('admin-lock-screen');
    const elAdminDashboard = document.getElementById('admin-dashboard');
    const elAdminLoginForm = document.getElementById('admin-login-form');
    const elAdminPasswordInput = document.getElementById('admin-password-input');
    const elAdminError = document.getElementById('admin-error');
    const elLogout = document.getElementById('btn-logout');

    // Check if already logged in
    function checkAdminAuth() {
        if (sessionStorage.getItem('admin_unlocked') === 'true') {
            elAdminLockScreen.classList.add('hidden');
            elAdminDashboard.classList.remove('hidden');
            loadPasswordData();
        }
    }

    // Admin login handler
    elAdminLoginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const password = elAdminPasswordInput.value;
        
        if (password === MASTER_ADMIN_PASSWORD) {
            sessionStorage.setItem('admin_unlocked', 'true');
            elAdminLockScreen.classList.add('hidden');
            elAdminDashboard.classList.remove('hidden');
            elAdminError.classList.add('hidden');
            elAdminPasswordInput.value = '';
            loadPasswordData();
        } else {
            elAdminError.classList.remove('hidden');
            elAdminPasswordInput.value = '';
            elAdminPasswordInput.focus();
        }
    });

    // Logout
    elLogout.addEventListener('click', () => {
        sessionStorage.removeItem('admin_unlocked');
        elAdminDashboard.classList.add('hidden');
        elAdminLockScreen.classList.remove('hidden');
        elAdminPasswordInput.focus();
    });

    // Load password data from localStorage
    function loadPasswordData() {
        const data = JSON.parse(localStorage.getItem('baccarat_passwords') || '{"passwords": [], "logs": []}');
        renderPasswordsList(data.passwords);
        renderActivityLog(data.logs);
        updateRotationCounts(data.passwords);
    }

    // Render passwords list
    function renderPasswordsList(passwords) {
        const container = document.getElementById('passwords-list');
        
        if (passwords.length === 0) {
            container.innerHTML = '<p class="text-xs text-slate-500 italic">No passwords configured. Add one to get started.</p>';
            return;
        }

        let html = '';
        passwords.forEach((pwd, idx) => {
            const nextRotation = pwd.rotation !== 'none' ? calculateNextRotation(pwd.nextRotation) : 'Never';
            const statusColor = pwd.active ? 'text-emerald-400' : 'text-slate-500';
            
            html += `
                <div class="bg-slate-950 border border-slate-800 rounded p-3 flex justify-between items-center">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-mono font-bold text-lg text-cyan-400">${pwd.code}</span>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${pwd.rotation === 'none' ? 'Static' : pwd.rotation.charAt(0).toUpperCase() + pwd.rotation.slice(1)}</span>
                            ${pwd.active ? '<span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded">ACTIVE</span>' : ''}
                        </div>
                        <div class="text-xs text-slate-400">
                            ${pwd.description ? `<p>${pwd.description}</p>` : ''}
                            <p class="mt-1">Next Rotation: <span class="${statusColor}">${nextRotation}</span></p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        ${!pwd.active ? `<button onclick="activatePassword(${idx})" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs px-2 py-1 rounded border border-emerald-600/50 transition">Activate</button>` : ''}
                        <button onclick="deletePassword(${idx})" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 text-xs px-2 py-1 rounded border border-red-600/50 transition">Delete</button>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }

    // Render activity log
    function renderActivityLog(logs) {
        const container = document.getElementById('activity-log');
        
        if (logs.length === 0) {
            container.innerHTML = '<p class="text-slate-500 italic">No activity yet.</p>';
            return;
        }

        let html = logs.slice(-20).reverse().map(log => {
            const time = new Date(log.timestamp).toLocaleString();
            const color = log.type === 'error' ? 'text-red-400' : log.type === 'success' ? 'text-emerald-400' : 'text-slate-400';
            return `<p class="${color}">[${time}] ${log.message}</p>`;
        }).join('');
        
        container.innerHTML = html;
    }

    // Update rotation counts
    function updateRotationCounts(passwords) {
        const daily = passwords.filter(p => p.rotation === 'daily').length;
        const weekly = passwords.filter(p => p.rotation === 'weekly').length;
        const biweekly = passwords.filter(p => p.rotation === 'biweekly').length;
        
        document.getElementById('daily-count').innerText = daily;
        document.getElementById('weekly-count').innerText = weekly;
        document.getElementById('biweekly-count').innerText = biweekly;
    }

    // Calculate next rotation time
    function calculateNextRotation(nextRotationTime) {
        if (!nextRotationTime) return 'Not set';
        const diff = new Date(nextRotationTime) - new Date();
        if (diff < 0) return 'Due now';
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        
        if (days > 0) return `${days}d ${hours}h`;
        return `${hours}h`;
    }

    // Add new password
    document.getElementById('add-password-form').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const code = document.getElementById('new-passcode').value;
        const rotation = document.getElementById('new-rotation').value;
        const description = document.getElementById('new-description').value;
        
        const data = JSON.parse(localStorage.getItem('baccarat_passwords') || '{"passwords": [], "logs": []}');
        
        // Check if password already exists
        if (data.passwords.some(p => p.code === code)) {
            alert('This password already exists!');
            return;
        }
        
        // Calculate next rotation time
        let nextRotation = null;
        if (rotation !== 'none') {
            const days = rotation === 'daily' ? 1 : rotation === 'weekly' ? 7 : 14;
            nextRotation = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
        }
        
        const newPassword = {
            code,
            rotation,
            description,
            active: data.passwords.length === 0, // First password is active
            createdAt: new Date().toISOString(),
            nextRotation
        };
        
        data.passwords.push(newPassword);
        data.logs.push({
            timestamp: new Date().toISOString(),
            type: 'success',
            message: `Added password: ${code} (${rotation})`
        });
        
        localStorage.setItem('baccarat_passwords', JSON.stringify(data));
        
        // Update main dashboard
        updateMainDashboard(data.passwords);
        
        // Clear form
        document.getElementById('add-password-form').reset();
        loadPasswordData();
    });

    // Activate password
    window.activatePassword = function(idx) {
        const data = JSON.parse(localStorage.getItem('baccarat_passwords') || '{"passwords": [], "logs": []}');
        
        // Deactivate all, then activate selected
        data.passwords.forEach(p => p.active = false);
        data.passwords[idx].active = true;
        
        data.logs.push({
            timestamp: new Date().toISOString(),
            type: 'success',
            message: `Activated password: ${data.passwords[idx].code}`
        });
        
        localStorage.setItem('baccarat_passwords', JSON.stringify(data));
        updateMainDashboard(data.passwords);
        loadPasswordData();
    };

    // Delete password
    window.deletePassword = function(idx) {
        if (!confirm('Are you sure you want to delete this password?')) return;
        
        const data = JSON.parse(localStorage.getItem('baccarat_passwords') || '{"passwords": [], "logs": []}');
        const deleted = data.passwords[idx];
        
        data.passwords.splice(idx, 1);
        data.logs.push({
            timestamp: new Date().toISOString(),
            type: 'warning',
            message: `Deleted password: ${deleted.code}`
        });
        
        // Ensure at least one active password
        if (!data.passwords.some(p => p.active) && data.passwords.length > 0) {
            data.passwords[0].active = true;
        }
        
        localStorage.setItem('baccarat_passwords', JSON.stringify(data));
        updateMainDashboard(data.passwords);
        loadPasswordData();
    };

    // Rotate passwords
    window.rotatePasswords = function(rotationType) {
        const data = JSON.parse(localStorage.getItem('baccarat_passwords') || '{"passwords": [], "logs": []}');
        const targetPasswords = data.passwords.filter(p => p.rotation === rotationType);
        
        if (targetPasswords.length === 0) {
            alert(`No ${rotationType} passwords found!`);
            return;
        }
        
        targetPasswords.forEach(pwd => {
            pwd.nextRotation = new Date(Date.now() + (rotationType === 'daily' ? 1 : rotationType === 'weekly' ? 7 : 14) * 24 * 60 * 60 * 1000).toISOString();
        });
        
        data.logs.push({
            timestamp: new Date().toISOString(),
            type: 'success',
            message: `Rotated ${targetPasswords.length} ${rotationType} password(s)`
        });
        
        localStorage.setItem('baccarat_passwords', JSON.stringify(data));
        loadPasswordData();
    };

    // Update main dashboard with active passwords
    function updateMainDashboard(passwords) {
        const activePasswords = passwords.filter(p => p.active).map(p => p.code);
        localStorage.setItem('baccarat_active_codes', JSON.stringify(activePasswords));
    }

    // Initialize
    checkAdminAuth();
</script>

</body>
</html>
